:root{--bg:#0b0a09;--bg2:#13110e;--card:#181510;--fg:#efe8da;--mut:#efe8da8c;--line:#efe8da22;--g:#c9a45c;--on:#0b0a09;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#efe8da;--bg2:#e6decd;--card:#f7f2e7;--fg:#0b0a09;--mut:#0b0a098c;--line:#0b0a0922;--g:#8f6b1f;--on:#efe8da}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Peyda,Tahoma,sans-serif;font-weight:500;height:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.app{display:grid;grid-template-columns:270px 1fr;height:100%}
aside{background:var(--bg2);border-left:1px solid var(--line);padding:26px 20px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.who{display:flex;gap:12px;align-items:center}.who svg{width:52px;height:52px}.who b{direction:rtl!important;font-size:26px!important}
.who b{font-family:Paykan,Peyda,sans-serif;font-weight:800;font-size:24px;display:block;direction:ltr;text-align:right}.who small{color:var(--g);font-size:13px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:right;padding:10px 14px;border-radius:10px;color:var(--mut);transition:.25s}
nav button.on{background:var(--g);color:var(--on);font-weight:700}
nav button:not(.on):hover{background:var(--line)}
.ringbox{position:relative;text-align:center}
.ringbox svg{width:150px;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:5;stroke-linecap:round}.t0{stroke:var(--line)}.pr{stroke:var(--g);stroke-dasharray:251;stroke-dashoffset:251;transition:stroke-dashoffset .9s cubic-bezier(.6,0,.2,1)}
#pct{position:absolute;top:44px;left:0;right:0;font-family:Dg,Peyda,sans-serif;font-weight:700;font-size:34px}
#cnt{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.pomo{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.pomo small{color:var(--mut);font-size:12px}
#tm{font-family:Dg,Peyda,sans-serif;font-weight:700;font-size:40px;direction:ltr;margin:4px 0 8px}
.pomo .bt{display:flex;gap:8px;justify-content:center}
.sm{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px;transition:.2s}.sm:hover{border-color:var(--g);color:var(--g)}
.sm.f{background:var(--g);color:var(--on);border-color:var(--g)}
.sf{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
main{padding:34px 44px;overflow:auto}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ey{color:var(--g);font-size:15px}
h1{font-family:Dg,Paykan,Peyda,sans-serif;font-weight:800;font-size:54px;line-height:1.25}
.sub{color:var(--mut);font-size:15px}
.nv{display:flex;gap:8px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:26px 0}
.dc{border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;transition:.25s;position:relative}
.dc:hover{border-color:var(--g)}.dc small{display:block;color:var(--mut);font-size:12px}
.dc b{font-family:Dg,Peyda,sans-serif;font-weight:700;font-size:22px}
.dc.on{background:var(--g);color:var(--on);border-color:var(--g)}.dc.on small{color:var(--on)}
.dc.td::after{content:"";position:absolute;top:6px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--g)}.dc.on.td::after{background:var(--on)}
.dc i{display:block;font-style:normal;font-size:11px;color:var(--g);height:14px}.dc.on i{color:var(--on)}
.focus{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font-family:Paykan,Peyda,sans-serif;font-size:22px;font-weight:700;margin-bottom:22px;outline:0}
.focus:focus{border-color:var(--g)}::placeholder{color:var(--mut)}
.add{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:22px;flex-wrap:wrap}
.add input,.add select{background:transparent;border:0;outline:0;padding:10px;border-radius:8px}
.add #ti{flex:1;min-width:160px;font-size:17px}.add select{background:var(--bg2)}.add button{background:var(--g);color:var(--on);border-radius:10px;padding:0 20px;font-weight:700;font-size:20px}
.sec{color:var(--mut);font-size:13px;margin:18px 0 8px}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--g);display:grid;place-items:center;transition:.25s}
.ck svg{width:14px;stroke:var(--on);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:.35s .05s}
.done .ck{background:var(--g)}.done .ck svg{stroke-dashoffset:0}
.tx{flex:1;font-size:18px;outline:0;transition:.3s}.done .tx{text-decoration:line-through;opacity:.45}
.mt{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.tg{border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.tm{font-family:Dg,Peyda,sans-serif;font-weight:700;direction:ltr}
.st{color:var(--mut);font-size:20px;transition:.2s}.st.on{color:var(--g)}
.x{opacity:0;color:var(--mut);font-size:22px;transition:.2s}.task:hover .x{opacity:1}.x:hover{color:#e0674f}
.empty{text-align:center;color:var(--mut);padding:50px 0}.empty b{display:block;font-family:Paykan,Peyda,sans-serif;font-size:30px;color:var(--fg);margin-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:24px;overflow-x:auto}
.col{border:1px solid var(--line);border-radius:14px;padding:12px;min-height:300px;background:var(--card)}
.col.td{border-color:var(--g)}.col h3{font-family:Paykan,Peyda,sans-serif;font-size:17px;cursor:pointer;margin-bottom:10px;display:flex;justify-content:space-between}.col h3 small{color:var(--mut);font-family:Peyda;font-weight:500;font-size:12px}
.wt{font-size:13px;overflow-wrap:anywhere;padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;cursor:pointer}.wt.done{opacity:.45;text-decoration:line-through}.wt:before{content:"○";color:var(--g)}.wt.done:before{content:"●"}
.tp{display:inline-flex;align-items:center;gap:2px;background:var(--bg2);border-radius:8px;padding:0 8px;border:1px solid var(--line)}
.tp select{background:transparent!important;border:0;outline:0;padding:9px 2px;appearance:none;-webkit-appearance:none;text-align:center;font-weight:700;direction:ltr;font-size:16px;cursor:pointer;min-width:34px}
.tp select option{background:var(--bg2);color:var(--fg)}.tp span{color:var(--g);font-weight:700}
.tm{border:1px solid var(--g);color:var(--g)!important;border-radius:99px;padding:2px 12px;font-size:14px;transition:.2s}.tm:hover{background:var(--g);color:var(--on)!important}
.addt{border-style:dashed;color:var(--mut);transition:.2s}.addt:hover{border-color:var(--g);color:var(--g)}
.row-tp .tp{padding:0 4px}.row-tp .tp select{padding:4px 0;font-size:14px;min-width:28px}
.dur{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--mut)}.dur .sm{padding:2px 10px}

.task{display:flex;align-items:center;gap:14px;padding:14px 6px;border-top:1px solid var(--line);transition:.25s}
button:active{transform:scale(.93)}.sm,.dc,.col{transition:.25s}.sm:hover{transform:translateY(-2px)}.dc:hover{transform:translateY(-3px)}
.app{opacity:0}body.ready .app{opacity:1}
body.ready aside>*{animation:up .7s cubic-bezier(.2,.9,.2,1) both}
body.ready aside>:nth-child(1){animation-delay:190ms}body.ready aside>:nth-child(2){animation-delay:280ms}body.ready aside>:nth-child(3){animation-delay:370ms}body.ready aside>:nth-child(4){animation-delay:460ms}body.ready aside>:nth-child(5){animation-delay:550ms}body.ready aside>:nth-child(6){animation-delay:640ms}
body.ready main{animation:up .9s .3s cubic-bezier(.2,.9,.2,1) both}

 return `<div class="bsum"><div><b>${fa(tot)}</b> کار · <b>${fa(dn)}</b> انجام‌شده</div><div class="bar"><i style="width:${p}%"></i></div><span>${fa(p)}٪</span></div><div class="board">${S.bk.map(bk=>{const cs=S.cards.filter(c=>c.b===bk.id).sort((a,b)=>a.o-b.o);return `<div class="bcol" data-b="${bk.id}"><div class="bh"><b>${esc(bk.n)}</b><span>${fa(cs.length)}</span><button class="x" data-a="bx">×</button></div><input class="bi" placeholder="+ افزودن کار (Enter)" autocomplete="off"><div class="bl">${cs.map(card).join('')}</div></div>`}).join('')}<div class="bcol bnew"><input id="bn2" class="bi" placeholder="+ ستون جدید (Enter)" autocomplete="off"></div></div>`}
function moveCard(c,bid,before){const was=c.b;c.b=bid;const L=S.cards.filter(x=>x.b===bid&&x!==c).sort((a,b)=>a.o-b.o);let i=before?L.findIndex(x=>x.id===before):-1;if(i<0)i=L.length;L.splice(i,0,c);L.forEach((x,j)=>x.o=j);save();render();if(cid)modal();if(was!==bid){if(bid===lastB()){pop('done',esc(c.t));burst(innerWidth/2,innerHeight/2,44,9)}else pop('move',esc(bkN(bid)))}}
function modal(){const c=cur2(),m=$('#md');if(!c){m.innerHTML='';m.className='';return}const dn=c.ck.filter(x=>x.d).length;
 m.className='on';m.innerHTML=`<div class="scrim" data-a="mc"></div><div class="sheet"><div class="mh"><input class="mt2" id="mt" value="${esc(c.t)}"><button class="x" data-a="mc" style="opacity:1">✕</button></div><div class="mrow"><label>ستون<select id="mb2">${S.bk.map(b=>`<option value="${b.id}" ${b.id===c.b?'selected':''}>${esc(b.n)}</option>`).join('')}</select></label><label>موعد<input type="date" id="md2" value="${c.due||''}"></label><label>اولویت<select id="mp2">${['عادی','مهم','فوری'].map((n,i)=>`<option value="${i}" ${c.pr==i?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="lbs big">${LB.map((n,i)=>`<button class="l l${i} ${c.lab.includes(i)?'on':''}" data-a="cl" data-i="${i}">${n}</button>`).join('')}</div><div class="sec">چک‌لیست ${c.ck.length?fa(dn)+' از '+fa(c.ck.length):''}</div>${c.ck.length?`<div class="bar"><i style="width:${Math.round(dn/c.ck.length*100)}%"></i></div>`:''}${c.ck.map((x,i)=>`<div class="ci ${x.d?'done':''}"><button class="ck" data-a="ci" data-i="${i}"><svg viewBox="0 0 16 16"><path d="M2 8l4 4 8-8"/></svg></button><span>${esc(x.t)}</span><button class="x" data-a="cd" data-i="${i}" style="opacity:.6">×</button></div>`).join('')}<input class="bi" id="cin" placeholder="+ مورد جدید (Enter)" autocomplete="off"><textarea id="mde" placeholder="توضیحات...">${esc(c.d||'')}</textarea><div class="mf"><button class="sm" data-a="cdel">حذف کار</button><button class="sm f" data-a="mc">تمام</button></div></div>`}
let dg=null;

document.addEventListener('click',e=>{
 const n=e.target.closest('nav button');if(e.target.id==='scr'){closeSh();return}if(n&&!n.dataset.v){$('aside').classList.toggle('open');$('#scr').classList.toggle('on');return}if(n){view=n.dataset.v;sw=1;closeSh();render();return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,row=el.closest('[data-id]'),t=row&&S.tasks.find(x=>String(x.id)===row.dataset.id);
 if(a==='tg'&&t){t.done=t.done?0:1;save();const r=el.getBoundingClientRect(),bx=r.x+r.width/2,by=r.y+r.height/2;fresh.add(t.id);render();fresh.clear();if(t.done){const L=list(t.d);if(L.every(x=>x.done)){big('all');burst(bx,by,30,7)}else{pop('done',fa(L.filter(x=>x.done).length)+' از '+fa(L.length)+' انجام شد');burst(bx,by,26,6)}}else pop('undo')}
 else if(a==='st'&&t){t.pr=t.pr?0:1;save();render();pop(t.pr?'star':'unstar')}
 else if(a==='rm'&&t){const nm=t.t;S.tasks=S.tasks.filter(x=>x!==t);save();render();pop('del',nm)}

 else if(a==='nx'){cur=addD(cur,view!=='day'?7:1);sw=1;render()}

 else if(a==='go'){const[y,m,d]=el.dataset.k.split('-');cur=new Date(+y,+m-1,+d,12);if(el.dataset.day)view='day';sw=1;render()}

 else if(a==='bm'){const c=S.cards.find(x=>x.id===el.closest('.cd').dataset.c),i=S.bk.findIndex(b=>b.id===c.b)+(+el.dataset.d);if(S.bk[i])moveCard(c,S.bk[i].id)}
 else if(a==='bx'){const id=el.closest('.bcol').dataset.b;if(S.bk.length<3||id===lastB())return pop('hundo');S.cards.forEach(c=>{if(c.b===id)c.b=S.bk[0].id});S.bk=S.bk.filter(b=>b.id!==id);save();render();pop('hdel')}
 else if(a==='cl'){const c=cur2(),i=+el.dataset.i,k=c.lab.indexOf(i);k<0?c.lab.push(i):c.lab.splice(k,1);save();modal();render()}
 else if(a==='ci'){const c=cur2(),x=c.ck[+el.dataset.i],r=el.getBoundingClientRect();x.d=x.d?0:1;save();modal();render();if(x.d){pop('done',esc(x.t));burst(r.x+r.width/2,r.y+r.height/2,22,6)}}
 else if(a==='cd'){const c=cur2();c.ck.splice(+el.dataset.i,1);save();modal();render()}
 else if(a==='cdel'){S.cards=S.cards.filter(x=>x.id!==cid);cid=null;save();modal();render();pop('del')}
 else if(a==='add')add();
 else if(a==='ha')addH();
 else if(a==='hx'){const id=el.closest('[data-h]').dataset.h;S.habits=S.habits.filter(x=>x.id!==id);save();render();pop('hdel')}
 else if(a==='hc'){const hb=S.habits.find(x=>x.id===el.closest('[data-h]').dataset.h),k=el.dataset.k,b4=mp().p,r=el.getBoundingClientRect();if(hb.days[k])delete hb.days[k];else hb.days[k]=1;save();const on=!!hb.days[k],a4=mp().p;hn=hb.id+k;render();hn='';if(on){pop('habit','زنجیره '+fa(streaks(hb).cur)+' روزه');burst(r.x+r.width/2,r.y+r.height/2,20,5);[50,75,100].forEach(m=>{if(b4<m&&a4>=m)setTimeout(()=>big('lvl',m),500)})}else pop('hundo')}
 else if(a==='et'&&t){editT=t.id;render()}
 else if(a==='ok'){editT=null;render()}
 else if(a==='cv'){const nk=key(addD(cur,1));let c=0;S.tasks.forEach(x=>{if(x.d===key(cur)&&!x.done){x.d=nk;c++}});save();cur=addD(cur,1);sw=1;render();pop('carry',fa(c)+' کار به فردا رفت')}
 else if(a==='ed'&&t){el.contentEditable='plaintext-only';el.focus();el.onblur=()=>{el.contentEditable='false';const v=el.textContent.trim();if(v){const ch=t.t!==v;t.t=v;save();if(ch)setTimeout(()=>pop('edit'),0)}render()};el.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();el.blur()}}}
});

 if(e.key==='Escape'&&cid){cid=null;modal();render()}if(e.target.classList.contains('bi')&&e.key==='Enter'){const v=e.target.value.trim();if(!v)return;if(e.target.id==='bn2'){S.bk.splice(S.bk.length-1,0,{id:'b'+Date.now(),n:v});save();render();pop('hadd',esc(v))}else if(e.target.id==='cin'){cur2().ck.push({t:v,d:0});save();modal();render();$('#cin').focus()}else{S.cards.push({id:'c'+Date.now(),b:e.target.closest('.bcol').dataset.b,t:v,lab:[],ck:[],due:'',pr:0,o:Date.now(),d:''});save();render();pop('add',esc(v));burst(innerWidth/2,150,14,4)}return}if(e.target.id==='ti'&&e.key==='Enter')add();if(e.target.id==='hi'&&e.key==='Enter')addH();
